<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/fintech-app.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App de gestion financiera</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #0f172a; }
      .startup-status {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        padding: 2rem;
        box-sizing: border-box;
        color: #cbd5e1;
        font: 500 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      .startup-status small { color: #94a3b8; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-status" class="startup-status">
        <span>Iniciando la aplicación…</span>
        <small>La pantalla se actualizará cuando los componentes estén listos.</small>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        var status = document.getElementById('startup-status');
        if (!status) return;
        status.innerHTML = '<span>No se pudo completar la carga.</span><small>Cerrá esta pestaña y volvé a iniciar la aplicación desde el acceso directo.</small>';
      }, 10000);
    </script>
  </body>
</html>
